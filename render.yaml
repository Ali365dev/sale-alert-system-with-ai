services:

  # ── App Server ──────────────────────────────────────────────────────────────
  # Handles: auth, brands, offers, categories, preferences, sale_alerts,
  # overview, search. Runs the background scheduler.
  - name: sales-alert-app
    type: web
    runtime: docker
    dockerfilePath: ./app_server/Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: GMAIL_CREDENTIALS_JSON
        sync: false

      - key: GMAIL_LABEL
        value: sales_offers

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

      - key: GROQ_API_KEY
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: SETTINGS_ENCRYPTION_KEY
        sync: false

      - key: ADDITIONAL_CORS_ORIGINS
        sync: false

      - key: LOG_LEVEL
        value: INFO

      # Keep-alive: ping the app server every 10 min so it never sleeps.
      - key: APP_SERVER_URL
        value: https://sales-alert-app.onrender.com

      - key: OFFER_MATCH_MODE
        value: or

      # Keep-alive: ping the scraper server every 10 min so it never sleeps.
      # Set this to your deployed scraper service URL after first deploy.
      - key: SCRAPER_SERVER_URL
        value: https://sales-alert-scraper.onrender.com

  # ── Scraper Server ──────────────────────────────────────────────────────────
  # Handles: analytics, insights, jobs, notifications, automation, settings,
  # brand_requests, emails, unknown_emails, website scraping, social scraping,
  # brand discovery.
  - name: sales-alert-scraper
    type: web
    runtime: docker
    dockerfilePath: ./scraper_server/Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

      - key: GROQ_API_KEY
        sync: false

      - key: TAVILY_API_KEY
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: SETTINGS_ENCRYPTION_KEY
        sync: false

      - key: ADDITIONAL_CORS_ORIGINS
        sync: false

      - key: LOG_LEVEL
        value: INFO
