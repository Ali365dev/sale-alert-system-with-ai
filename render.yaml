services:
  - name: gmail-offers-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true

    # No persistent Disk here on purpose — Free web services don't support
    # one (filesystem resets on every redeploy/restart/spin-down). The Gmail
    # OAuth token is instead stored in the `Setting` DB row
    # "gmail_oauth_token" (Fernet-encrypted with SETTINGS_ENCRYPTION_KEY —
    # see gmail/gmail_client.py), so it survives regardless of host storage.
    #
    # First-time auth: run `python -c "from gmail.gmail_client import
    # get_gmail_service; get_gmail_service()"` LOCALLY, with your local .env
    # pointed at the SAME DATABASE_URL and the SAME SETTINGS_ENCRYPTION_KEY
    # you set below — completing the browser consent flow locally then
    # writes the token straight into the shared DB this service reads from.
    # No file to copy, no Shell tab needed.
    #
    # Free-tier services spin down after 15 min idle and cold-start on the
    # next request (~1 min) — ping /api/health every ~10 min from a free
    # service like UptimeRobot or cron-job.org to keep it warm and so the
    # daily offer-cleanup scheduler actually fires.

    envVars:
      - key: GMAIL_CREDENTIALS_JSON
        sync: false  # paste the raw contents of your credentials.json here

      - key: GMAIL_LABEL
        value: sales_offers

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GROQ_API_KEY
        sync: false

      # External Postgres — Supabase or Render's own managed Postgres both
      # work; this just needs a valid connection string either way. Use the
      # SAME connection string in your local .env for first-time Gmail auth
      # (see note above).
      - key: DATABASE_URL
        sync: false

      # Must match the value in your local .env used for first-time Gmail
      # auth (it encrypts the token row in the shared DB) — set it
      # explicitly here rather than letting Render generate one. Never
      # rotate it once API keys or the Gmail token have been saved, or they
      # become unreadable.
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false

      # Comma-separated exact origins for the deployed dashboard frontend,
      # e.g. https://your-dashboard.onrender.com — required for Settings
      # login (credentialed requests) to work from a browser. Leave unset
      # only if the dashboard is never used from anywhere but localhost.
      - key: ADDITIONAL_CORS_ORIGINS
        sync: false

      - key: LOG_LEVEL
        value: INFO
