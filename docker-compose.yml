version: "3.9"

services:
  dashboard:
    build: .
    container_name: gmail_offers_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./gmail_offers.db:/app/gmail_offers.db   # persist SQLite
      - ./logs:/app/logs                          # persist logs
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    build: .
    container_name: gmail_offers_scheduler
    restart: unless-stopped
    command: ["python", "scheduler/jobs.py"]
    volumes:
      - ./gmail_offers.db:/app/gmail_offers.db
      - ./logs:/app/logs
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    env_file:
      - .env
    depends_on:
      dashboard:
        condition: service_healthy
