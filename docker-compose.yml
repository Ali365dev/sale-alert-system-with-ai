version: "3.9"

services:
  api:
    build: .
    container_name: gmail_offers_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./gmail_offers.db:/app/gmail_offers.db   # persist SQLite
      - ./logs:/app/logs                          # persist logs
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
